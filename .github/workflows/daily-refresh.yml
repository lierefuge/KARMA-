name: Gunluk icerik yenile

on:
  schedule:
    # UTC 21:00 = ertesi gün Türkiye 00:00; Actions gecikebilir.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Yazmadan dene (Gemini API çağrılmaz, commit/build tetiklenmez)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

# Build ile aynı dalın yazma kilidini paylaş; çalışan güncellemeyi yarıda kesme.
concurrency:
  group: content-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Bagimliliklar
        run: npm ci --no-audit --no-fund
      - name: Yazmadan dene
        if: inputs.dry_run == true
        run: |
          node tools/fetch-new-releases.js --dry
          node tools/ai-enrich.js --dry
          node tools/refresh-discographies.js --dry
      - name: Yeni sarkilari cek
        id: releases
        if: inputs.dry_run != true
        continue-on-error: true
        run: node tools/fetch-new-releases.js
      - name: Gemini anahtarini kontrol et
        id: key
        if: inputs.dry_run != true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Anahtar yoksa adım sessizce düşüp iş akışını kırmızıya çevirmesin:
          # zenginleştirme OPSİYONEL bir kaynaktır, oyun gömülü veriyle devam eder.
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GEMINI_API_KEY tanimli degil::Gemini zenginlestirmesi atlanacak; diger kaynaklar ve korunmus veri kullanilir."
          fi
      - name: Gemini ile zenginlestir
        id: ai
        if: inputs.dry_run != true && steps.key.outputs.has == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tools/ai-enrich.js --limit 48
      - name: YouTube guncelle
        id: youtube
        if: inputs.dry_run != true
        continue-on-error: true
        run: node tools/fetch-youtube.js
      - name: Diskografileri guncelle
        id: discography
        if: inputs.dry_run != true
        continue-on-error: true
        run: node tools/refresh-discographies.js
      - name: Veri farkini kontrol et
        id: data
        if: inputs.dry_run != true
        run: |
          if git diff --quiet -- js/data/release-intel.js js/data/real-youtube.js js/data/real-songs.js js/data/discography.js js/data/real-previews.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build ve tam dogrulama
        id: build
        if: steps.data.outputs.changed == 'true'
        run: |
          npm run build
          npm run version:json
          npm run verify
      - name: Dogrulanmis veri ve gerekli build dosyalarini commit et
        id: commit
        if: steps.data.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "karma-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- js/data/release-intel.js js/data/real-youtube.js js/data/real-songs.js js/data/discography.js js/data/real-previews.js index.html sw.js KARMA-Oyun.html version.json
          if ! git diff --cached --quiet; then
            git commit -m "veri: gunluk icerik yenilemesi ($(date -u +%F))"
            git fetch origin "$TARGET_BRANCH"
            # Uzak dal ilerlediyse doğrulanmamış birleştirme veya force-push yapma.
            git merge-base --is-ancestor FETCH_HEAD HEAD
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Build zincirini tetikle
        if: steps.commit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: gh workflow run build-artifact.yml --ref "$TARGET_BRANCH"
      - name: Kaynak durumlarini raporla
        if: always()
        env:
          RELEASES: ${{ steps.releases.outcome }}
          KEY: ${{ steps.key.outcome }}
          AI: ${{ steps.ai.outcome }}
          YOUTUBE: ${{ steps.youtube.outcome }}
          DISCOGRAPHY: ${{ steps.discography.outcome }}
          DATA: ${{ steps.data.outcome }}
          BUILD: ${{ steps.build.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
        run: |
          # KURAL: iki türlü başarısızlık ayrılır.
          #   · ZORUNLU adımlar (veri kontrolü · build/verify · commit) düşerse → KIRMIZI
          #   · DIŞ KAYNAKLAR (iTunes · Gemini · YouTube · diskografi) düşerse → UYARI
          # Eskiden herhangi bir dış kaynak hatası iş akışını kırmızıya çeviriyordu;
          # iş yine de commit atıyordu. Sonuç: her gün kırmızı bir rozet → gerçek
          # regresyon geldiğinde kimse fark etmiyor (alarm yorgunluğu).
          {
            echo "### Günlük veri kaynakları"
            echo ""
            echo "| Adım | Durum | Zorunlu |"
            echo "| --- | --- | --- |"
            echo "| Yeni çıkışlar | $RELEASES | hayır |"
            echo "| Gemini anahtarı | $KEY | hayır |"
            echo "| Gemini zenginleştirme | $AI | hayır |"
            echo "| YouTube | $YOUTUBE | hayır |"
            echo "| Diskografi | $DISCOGRAPHY | hayır |"
            echo "| Veri farkı | $DATA | evet |"
            echo "| Build + doğrulama | $BUILD | evet |"
            echo "| Commit + push | $COMMIT | evet |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Dış kaynak: her düşen kaynak için TEK satırlık, adı geçen uyarı.
          # (Adımın kendi logu korunur; burada yalnızca özet ve etiket verilir.)
          for pair in "Yeni cikislar:$RELEASES" "Gemini:$AI" "YouTube:$YOUTUBE" "Diskografi:$DISCOGRAPHY"; do
            name="${pair%%:*}"; state="${pair##*:}"
            if [ "$state" = "failure" ]; then
              echo "::warning title=Kaynak tamamlanamadi ($name)::Korunmus veri ve basarili guncellemeler kullanildi. Ayrintilar '$name' adiminin logunda."
            fi
          done

          # Zorunlu adımlardan biri düştüyse iş gerçekten başarısızdır.
          hard=0
          for pair in "Veri farki:$DATA" "Build+dogrulama:$BUILD" "Commit+push:$COMMIT"; do
            name="${pair%%:*}"; state="${pair##*:}"
            if [ "$state" = "failure" ]; then
              echo "::error title=Zorunlu adim dustu ($name)::Dogrulanmamis veri commit edilmez. Logu inceleyin."
              hard=1
            fi
          done
          if [ "$hard" = "1" ]; then exit 1; fi
          echo "Dış kaynak uyarıları raporlandı; zorunlu adımlar temiz."
