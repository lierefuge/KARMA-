name: Tek dosya build uret

# ============================================================
#  KARMA — tek dosya build'i ÜRETEN iş akışı
#
#  Neden var?
#  ----------
#  Depoda `KARMA-Oyun.html` (tek dosya build) tutuluyor ve `tools/verify.js`
#  bu dosyanın kaynaklarla BAYT BAYT aynı olmasını şart koşuyor. Bu kontrol
#  ÇOK DEĞERLİ: "kodu değiştirdim ama build'i unuttum" hatasını imkânsız
#  kılıyor. Bu yüzden kontrol ASLA atlanmaz/gevşetilmez.
#
#  Sorun: build 2,6 MB olduğu için bazı istemciler (API / entegrasyon
#  yazma yolları) dosyayı gönderemiyor. Çözüm, kontrolü kaldırmak değil,
#  build'i GITHUB'IN KENDİSİNDE üretmek:
#
#    1) önbellek damgası + tek dosya build + version.json üretilir
#    2) `npm run verify` KOŞAR — yani commit'lenecek çıktı doğrulanmış olur
#    3) yalnızca doğrulama geçerse ve gerçekten fark varsa commit edilir
#
#  Doğrulama düşerse HİÇBİR ŞEY commit edilmez: depo bozulmaz, sadece
#  iş akışı kırmızı olur ve nedenini logda gösterir.
#
#  KULLANIM: Kaynak push'unda kendiliğinden çalışır.
#  Elle: Actions → "Tek dosya build uret" → Run workflow (main)
# ============================================================

on:
  # Kaynak değişince KENDİLİĞİNDEN build üret (elle tıklama gerekmez).
  # Yalnızca build'i etkileyen yollar: dokümantasyon push'u boşuna build açmaz.
  push:
    branches: [main]
    paths:
      - "js/**"
      - "css/**"
      - "index.html"
      - "package.json"
      - "tools/**"
      - ".github/workflows/build-artifact.yml"
  workflow_dispatch:

permissions:
  contents: write
  # Dogrulama is akisini tetikleyebilmek icin gerekli
  actions: write

concurrency:
  group: content-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build uret + dogrula + commit
    # Bot'un kendi commit'i dongu yaratmasin (GITHUB_TOKEN zaten tetiklemez;
    # bu ikinci emniyet kilidi).
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynagi al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bagimliliklar (jsdom)
        run: npm ci --no-audit --no-fund

      - name: Build uret (damga + tek dosya + version.json)
        run: |
          node tools/bump-cache.js
          node tools/build-single.js
          node tools/gen-version-json.js

      # Build'i commit etmeden ÖNCE tam doğrulama: depoya yalnızca
      # doğrulanmış çıktı girer.
      - name: Tam dogrulama (commit oncesi kapi)
        run: npm run verify

      - name: Degisiklik var mi
        id: diff
        run: |
          if git diff --quiet --exit-code -- index.html sw.js KARMA-Oyun.html version.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Beklenen degisiklik yok: build zaten guncel."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      - name: Commit + push (secilen dal)
        id: commit
        if: steps.diff.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          git add -- index.html sw.js KARMA-Oyun.html version.json
          git commit -m "v${VERSION} - tek dosya build (CI tarafindan uretildi)"
          git fetch origin "$TARGET_BRANCH"
          git merge-base --is-ancestor FETCH_HEAD HEAD
          git push origin "HEAD:$TARGET_BRANCH"

      # ZINCIRI KAPAT: GITHUB_TOKEN ile yapilan push'lar baska is akislarini
      # tetiklemez. Bu yuzden Dogrulama'yi acikca workflow_dispatch ile
      # cagiriyoruz; izin permissions.actions: write.
      - name: Dogrulama is akisini tetikle
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if gh workflow run tests.yml --ref "$TARGET_BRANCH"; then
            echo "Dogrulama (tests.yml) tetiklendi."
          else
            echo "::error::Dogrulama tetiklenemedi - Actions write izni gerekli"
            exit 1
          fi

      - name: Ozet
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_STATUS: ${{ steps.commit.outcome }}
        run: |
          {
            echo "### Tek dosya build"
            echo ""
            if [ "$JOB_STATUS" != "success" ]; then
              echo "- Build zinciri başarısız; ilgili adımın hatasını inceleyin."
            elif [ "$COMMIT_STATUS" = "success" ]; then
              echo "- Build üretildi, doğrulandı ve seçilen dala commit edildi."
            else
              echo "- Build zaten gunceldi; commit gerekmedi."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
