<body>
  <div id="app">

    <!-- ================= TOP BAR ================= -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">K</div>
        <div class="brand-text">
          <span class="brand-name">KARMA</span>
          <span class="brand-sub">MUSIC INDUSTRY SIMULATOR</span>
        </div>
      </div>

      <div class="topbar-stats">
        <div class="stat" title="Oyun içi gün">
          <span class="stat-label">GÜN</span>
          <span class="stat-value" id="stat-day">1</span>
        </div>
        <div class="stat" title="Oyun içi tarih">
          <span class="stat-label">TARİH</span>
          <span class="stat-value" id="stat-date">1 Oca 2008</span>
        </div>
        <div class="stat" title="Oyuncu yaşı">
          <span class="stat-label">YAŞ</span>
          <span class="stat-value" id="stat-age">15</span>
        </div>
        <div class="stat" title="Kasa bakiyesi">
          <span class="stat-label">KASA</span>
          <span class="stat-value money" id="stat-balance">₺25.000</span>
        </div>
        <div class="stat" title="Sanatçı popülerliği">
          <span class="stat-label">POPÜLERLİK</span>
          <span class="stat-value" id="stat-pop">0</span>
        </div>
        <div class="stat" title="Aylık dinleyici">
          <span class="stat-label">AYLIK DİNL.</span>
          <span class="stat-value" id="stat-monthly">0</span>
        </div>
      </div>

      <div class="view-switch" id="view-switch">
        <button class="vs-btn active" data-view="career">🎤 Sanatçı / Kariyer</button>
        <button class="vs-btn" data-view="phone">📱 Telefon</button>
      </div>

      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btn-settings" title="Ayarlar & Kayıt">⚙️</button>
        <button class="btn btn-ghost" id="btn-save">Kaydet</button>
        <button class="btn btn-primary" id="btn-next-day">
          <span>Günü Bitir</span>
          <small>→ <b id="next-day-preview">2 Oca</b></small>
        </button>
      </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main class="layout">

      <!-- COMPANY / CAREER PANEL -->
      <section class="career-panel" id="career-panel">
        <nav class="career-tabs" id="career-tabs">
          <button class="tab active" data-tab="career">Kariyer</button>
          <button class="tab" data-tab="studio">Stüdyo</button>
          <button class="tab" data-tab="jobs">Yan İş</button>
          <button class="tab" data-tab="releases">Yayınlar</button>
          <button class="tab" data-tab="albums">Albümler</button>
          <button class="tab" data-tab="charts">Listeler</button>
          <button class="tab" data-tab="analytics">Analiz</button>
          <button class="tab" data-tab="concerts">Konser</button>
          <button class="tab" data-tab="label">Şirket</button>
          <button class="tab" data-tab="events">Olaylar</button>
        </nav>
        <div class="career-body" id="career-body"><!-- rendered by JS --></div>
      </section>

      <!-- PHONE -->
      <section class="phone-stage">
        <div class="phone-frame" id="phone-frame">
          <div class="phone-notch"></div>
          <div class="phone-screen" id="phone-screen">
            <div class="status-bar">
              <span class="status-time" id="status-time">09:41</span>
              <span class="status-island"></span>
              <span class="status-right" id="status-cc" title="Kontrol Merkezi">
                <span class="sig">▮▮▮</span>
                <span class="wifi">✦</span>
                <span class="battery"><i id="battery-level"></i></span>
              </span>
            </div>

            <div class="phone-viewport" id="phone-viewport">
              <!-- home screen / app screens injected here -->
            </div>

            <div class="home-indicator" id="home-indicator"></div>
          </div>
        </div>
        <p class="phone-hint">Uygulamaya dokun · Ana ekrana dönmek için çubuğa bas</p>
      </section>

    </main>

    <!-- ================= TOASTS / MODAL ================= -->
    <div class="toast-stack" id="toast-stack"></div>
    <div class="modal-root" id="modal-root"></div>
  </div>
