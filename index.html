<!--
  KARMA — önbellek (cache) sürümü artık OTOMATİK.
  Yerel css/ ve js/ dosyalarının sonundaki ?v= değeri ELLE ARTIRILMAZ;
  içerik hash'inden üretilir, yani herhangi bir dosya değişince kendiliğinden
  değişir ve tarayıcı eski kopyayı kullanamaz.

  YAYIN AKIŞI (tek komut):
    npm run release -- patch --verify   → sürümü yükselt + damgala + build + doğrula
    npm run verify                      → yalnızca tam doğrulama (~2 dk)

  Elle takip edilen yayın sürümü: js/version.js  (K.VERSION)
  Sürüm numarası önbellek hash'inden BAĞIMSIZDIR: hash makine için
  (her dosya değişiminde değişir), K.VERSION insan için.

  Yerel önizleme: npm run serve  →  http://localhost:8080
  (modüler sürümü file:// ile açmak ÇALIŞMAZ; tembel veri katmanı
   alt kaynak çektiği için http gerekir.)

  Otomatik doğrulama: .github/workflows/tests.yml — her push'ta
  aynı tam doğrulama zinciri koşar.
-->

      <!-- ==================================================================
           v10.17.2 — BÖLÜM DEĞİŞTİRİCİ ARTIK ÜST BARIN İÇİNDE DEĞİL.

           Neden taşındı: bu blok önceden .topbar içindeydi ve mobil için
           `position: fixed` ile ALT ÇUBUĞA dönüştürülüyordu. Ama .topbar'a
           eklenen `backdrop-filter: blur()` bir CONTAINING BLOCK yaratır
           (CSS spec: filter/backdrop-filter, fixed torunlar için kapsayıcı
           olur). Bu yüzden `position: fixed` VIEWPORT'a değil ÜST BARA göre
           konumlanıyordu: çubuk ekranın ortasına düşüyor, üst bardaki
           "Ayarlar" ve "Günü Bitir" düğmelerini kapatıyordu.

           Çözüm: blok #app'in son çocuğu. Böylece normal akışta gerçek bir
           alt çubuk olur (fixed gerekmez, hiçbir şeyi kapatmaz). #view-switch
           kimliği ve .vs-btn tıklama delegasyonu değişmedi — JS etkilenmez.
           ================================================================== -->

      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btn-settings" title="Ayarlar & Kayıt" aria-label="Ayarlar ve kayıt">⚙️</button>

        <button class="btn btn-primary" id="btn-next-day">
